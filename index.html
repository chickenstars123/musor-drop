<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mango Klikker</title>
  <style>
    :root {
      --bg: #fff7df;
      --card: #fffdf8;
      --accent: #ffcc4d;
      --accent-strong: #f4af00;
      --text: #3f3218;
      --muted: #62553b;
      --line: #efe0ad;
      --success: #2e8b57;
      --danger: #ba4a3f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: linear-gradient(180deg, #fff8e4 0%, #fff3c9 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .wrapper {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: 1.5fr 0.9fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(100, 74, 16, 0.12);
    }

    main {
      padding: 22px;
    }

    .game-header {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    #mango {
      width: 140px;
      height: 140px;
      border: 0;
      background: transparent;
      font-size: 110px;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 8px 10px rgba(111, 76, 0, 0.1));
    }

    #mango:active { transform: scale(0.92); }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
    }

    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
      padding: 16px;
    }

    .stat {
      background: #fff8ea;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .stat-label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--text);
      padding: 12px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease;
      font-weight: 600;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .shop {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .shop-title {
      margin: 18px 0 6px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .sidebar {
      padding: 18px;
      position: sticky;
      top: 20px;
    }

    .sidebar h2 {
      margin: 0 0 12px;
      font-size: 1.2rem;
    }

    .sidebar .mini {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }

    .sidebar .mini:last-child {
      border-bottom: none;
    }

    .sidebar .mini strong {
      color: var(--text);
    }

    .status-box {
      margin-top: 16px;
      background: #fff7ea;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .wrapper {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <main class="panel">
      <div class="game-header">
        <button id="mango" aria-label="Klik op de mango">🥭</button>
        <div>
          <h1>Mango Klikker</h1>
          <div class="sub">Klik, bouw een mango-farm, en unlock nieuwe upgrades.</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Mango-punten</span>
          <span id="points" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Zaden</span>
          <span id="seeds" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Per klik</span>
          <span id="perClick" class="stat-value">1</span>
        </div>
        <div class="stat">
          <span class="stat-label">Per seconde</span>
          <span id="perSecond" class="stat-value">0</span>
        </div>
      </div>

      <div class="actions">
        <button id="sellSeeds">Ruil 10 zaden → 50 punten</button>
        <button id="prestige">Prestige + bonus</button>
      </div>

      <div class="shop-title">Mango upgrades</div>
      <div class="shop">
        <button id="multiplier"></button>
        <button id="auto"></button>
        <button id="factory"></button>
        <button id="booster"></button>
      </div>

      <div class="shop-title">Farm / zaden upgrades</div>
      <div class="shop">
        <button id="farm"></button>
        <button id="greenhouse"></button>
        <button id="seedTrader"></button>
      </div>
    </main>

    <aside class="panel sidebar">
      <h2>Spelstatus</h2>

      <div class="mini"><span>Punten</span><strong id="pointsSide">0</strong></div>
      <div class="mini"><span>Zaden</span><strong id="seedsSide">0</strong></div>
      <div class="mini"><span>Prestige level</span><strong id="prestigeLevel">0</strong></div>
      <div class="mini"><span>Booster</span><strong id="boosterStatus">Uit</strong></div>

      <div class="status-box">
        <label><input type="checkbox" id="autobuy" /> Auto-buy upgrades</label>
      </div>
    </aside>
  </div>

  <script>
    const STORAGE_KEYS = {
      points: 'mango_points',
      seeds: 'mango_seeds',
      perClick: 'mango_per_click',
      perSecond: 'mango_per_second',
      seedPerSecond: 'mango_seed_per_second',
      multiplierCost: 'mango_multiplier_cost',
      autoCost: 'mango_auto_cost',
      factoryCost: 'mango_factory_cost',
      boosterCost: 'mango_booster_cost',
      farmCost: 'mango_farm_cost',
      greenhouseCost: 'mango_greenhouse_cost',
      seedTraderCost: 'mango_seed_trader_cost',
      factoryLevel: 'mango_factory_level',
      prestigeLevel: 'mango_prestige_level',
      autobuy: 'mango_autobuy',
      boosterEndsAt: 'mango_booster_ends_at'
    };

    let points = Number(localStorage.getItem(STORAGE_KEYS.points)) || 0;
    let seeds = Number(localStorage.getItem(STORAGE_KEYS.seeds)) || 0;
    let perClick = Number(localStorage.getItem(STORAGE_KEYS.perClick)) || 1;
    let perSecond = Number(localStorage.getItem(STORAGE_KEYS.perSecond)) || 0;
    let seedPerSecond = Number(localStorage.getItem(STORAGE_KEYS.seedPerSecond)) || 0;

    let multiplierCost = Number(localStorage.getItem(STORAGE_KEYS.multiplierCost)) || 10;
    let autoCost = Number(localStorage.getItem(STORAGE_KEYS.autoCost)) || 25;
    let factoryCost = Number(localStorage.getItem(STORAGE_KEYS.factoryCost)) || 120;
    let boosterCost = Number(localStorage.getItem(STORAGE_KEYS.boosterCost)) || 220;
    let farmCost = Number(localStorage.getItem(STORAGE_KEYS.farmCost)) || 50;
    let greenhouseCost = Number(localStorage.getItem(STORAGE_KEYS.greenhouseCost)) || 260;
    let seedTraderCost = Number(localStorage.getItem(STORAGE_KEYS.seedTraderCost)) || 100;

    let factoryLevel = Number(localStorage.getItem(STORAGE_KEYS.factoryLevel)) || 0;
    let prestigeLevel = Number(localStorage.getItem(STORAGE_KEYS.prestigeLevel)) || 0;
    let autobuy = localStorage.getItem(STORAGE_KEYS.autobuy) === 'true';
    let boosterActive = false;
    let boosterEndsAt = Number(localStorage.getItem(STORAGE_KEYS.boosterEndsAt)) || 0;

    const els = {
      points: document.getElementById('points'),
      seeds: document.getElementById('seeds'),
      perClick: document.getElementById('perClick'),
      perSecond: document.getElementById('perSecond'),
      pointsSide: document.getElementById('pointsSide'),
      seedsSide: document.getElementById('seedsSide'),
      prestigeLevel: document.getElementById('prestigeLevel'),
      boosterStatus: document.getElementById('boosterStatus'),
      multiplier: document.getElementById('multiplier'),
      auto: document.getElementById('auto'),
      factory: document.getElementById('factory'),
      booster: document.getElementById('booster'),
      farm: document.getElementById('farm'),
      greenhouse: document.getElementById('greenhouse'),
      seedTrader: document.getElementById('seedTrader'),
      sellSeeds: document.getElementById('sellSeeds'),
      prestige: document.getElementById('prestige'),
      mango: document.getElementById('mango'),
      autobuy: document.getElementById('autobuy')
    };

    function save() {
      localStorage.setItem(STORAGE_KEYS.points, String(points));
      localStorage.setItem(STORAGE_KEYS.seeds, String(seeds));
      localStorage.setItem(STORAGE_KEYS.perClick, String(perClick));
      localStorage.setItem(STORAGE_KEYS.perSecond, String(perSecond));
      localStorage.setItem(STORAGE_KEYS.seedPerSecond, String(seedPerSecond));
      localStorage.setItem(STORAGE_KEYS.multiplierCost, String(multiplierCost));
      localStorage.setItem(STORAGE_KEYS.autoCost, String(autoCost));
      localStorage.setItem(STORAGE_KEYS.factoryCost, String(factoryCost));
      localStorage.setItem(STORAGE_KEYS.boosterCost, String(boosterCost));
      localStorage.setItem(STORAGE_KEYS.farmCost, String(farmCost));
      localStorage.setItem(STORAGE_KEYS.greenhouseCost, String(greenhouseCost));
      localStorage.setItem(STORAGE_KEYS.seedTraderCost, String(seedTraderCost));
      localStorage.setItem(STORAGE_KEYS.factoryLevel, String(factoryLevel));
      localStorage.setItem(STORAGE_KEYS.prestigeLevel, String(prestigeLevel));
      localStorage.setItem(STORAGE_KEYS.autobuy, String(autobuy));
      localStorage.setItem(STORAGE_KEYS.boosterEndsAt, String(boosterEndsAt));
    }

    function formatNumber(value) {
      return Math.floor(value);
    }

    function updateBoosterState() {
      if (boosterEndsAt > Date.now()) {
        boosterActive = true;
      } else {
        boosterActive = false;
        boosterEndsAt = 0;
      }
    }

    function updateTexts() {
      updateBoosterState();

      els.points.textContent = formatNumber(points);
      els.seeds.textContent = formatNumber(seeds);
      els.pointsSide.textContent = formatNumber(points);
      els.seedsSide.textContent = formatNumber(seeds);
      els.perClick.textContent = formatNumber(perClick);
      els.perSecond.textContent = formatNumber(perSecond);
      els.prestigeLevel.textContent = prestigeLevel;
      els.boosterStatus.textContent = boosterActive ? 'Aan' : 'Uit';

      els.multiplier.textContent = `Klik-multiplier: +1 per klik — ${multiplierCost} punten`;
      els.auto.textContent = `Mango-machine: +1 punt/s — ${autoCost} punten`;
      els.factory.textContent = `Factory: +${factoryLevel} lvl — ${factoryCost} punten`;
      els.booster.textContent = boosterActive ? `Booster actief (${Math.ceil((boosterEndsAt - Date.now()) / 1000)}s)` : `Booster: x2 opbrengst — ${boosterCost} punten`;
      els.farm.textContent = `Farm: +1 zaad/s — ${farmCost} punten`;
      els.greenhouse.textContent = `Greenhouse: +5 zaden/s — ${greenhouseCost} punten`;
      els.seedTrader.textContent = `Seed Trader: 100 zaden → 250 punten — ${seedTraderCost} zaden`;

      els.multiplier.disabled = points < multiplierCost;
      els.auto.disabled = points < autoCost;
      els.factory.disabled = points < factoryCost;
      els.booster.disabled = points < boosterCost || boosterActive;
      els.farm.disabled = points < farmCost;
      els.greenhouse.disabled = points < greenhouseCost;
      els.seedTrader.disabled = seeds < seedTraderCost;
      els.sellSeeds.disabled = seeds < 10;

      els.autobuy.checked = autobuy;
      save();
    }

    function clickMango() {
      let gain = perClick;
      if (boosterActive) gain *= 2;
      gain *= (1 + prestigeLevel * 0.01);
      points += gain;
      updateTexts();
    }

    function tryAutobuy() {
      if (!autobuy) return;

      if (points >= farmCost) {
        points -= farmCost;
        seedPerSecond += 1;
        farmCost = Math.ceil(farmCost * 1.8);
      } else if (points >= autoCost) {
        points -= autoCost;
        perSecond += 1;
        autoCost = Math.ceil(autoCost * 1.7);
      } else if (points >= multiplierCost) {
        points -= multiplierCost;
        perClick += 1;
        multiplierCost = Math.ceil(multiplierCost * 1.6);
      } else if (points >= factoryCost) {
        points -= factoryCost;
        factoryLevel += 1;
        factoryCost = Math.ceil(factoryCost * 2.1);
      } else if (!boosterActive && points >= boosterCost) {
        points -= boosterCost;
        boosterActive = true;
        boosterEndsAt = Date.now() + 30_000;
        boosterCost = Math.ceil(boosterCost * 2.5);
      } else if (points >= greenhouseCost) {
        points -= greenhouseCost;
        seedPerSecond += 5;
        greenhouseCost = Math.ceil(greenhouseCost * 2.2);
      }

      updateTexts();
    }

    els.mango.addEventListener('click', clickMango);

    els.multiplier.addEventListener('click', () => {
      if (points < multiplierCost) return;
      points -= multiplierCost;
      perClick += 1;
      multiplierCost = Math.ceil(multiplierCost * 1.6);
      updateTexts();
    });

    els.auto.addEventListener('click', () => {
      if (points < autoCost) return;
      points -= autoCost;
      perSecond += 1;
      autoCost = Math.ceil(autoCost * 1.7);
      updateTexts();
    });

    els.factory.addEventListener('click', () => {
      if (points < factoryCost) return;
      points -= factoryCost;
      factoryLevel += 1;
      factoryCost = Math.ceil(factoryCost * 2.1);
      updateTexts();
    });

    els.booster.addEventListener('click', () => {
      if (points < boosterCost || boosterActive) return;
      points -= boosterCost;
      boosterActive = true;
      boosterEndsAt = Date.now() + 30000;
      boosterCost = Math.ceil(boosterCost * 2.5);
      updateTexts();
    });

    els.farm.addEventListener('click', () => {
      if (points < farmCost) return;
      points -= farmCost;
      seedPerSecond += 1;
      farmCost = Math.ceil(farmCost * 1.8);
      updateTexts();
    });

    els.greenhouse.addEventListener('click', () => {
      if (points < greenhouseCost) return;
      points -= greenhouseCost;
      seedPerSecond += 5;
      greenhouseCost = Math.ceil(greenhouseCost * 2.2);
      updateTexts();
    });

    els.seedTrader.addEventListener('click', () => {
      if (seeds < seedTraderCost) return;
      seeds -= seedTraderCost;
      points += 250;
      seedTraderCost = Math.ceil(seedTraderCost * 1.5);
      updateTexts();
    });

    els.sellSeeds.addEventListener('click', () => {
      if (seeds < 10) return;
      seeds -= 10;
      points += 50;
      updateTexts();
    });

    els.prestige.addEventListener('click', () => {
      if (points < 1000) {
        alert('Je hebt minstens 1000 mango-punten nodig om te prestige te gaan.');
        return;
      }

      const gainedLevels = Math.floor(points / 1000);
      prestigeLevel += gainedLevels;
      points = 0;
      seeds = 0;
      perClick = 1;
      perSecond = 0;
      seedPerSecond = 0;
      multiplierCost = 10;
      autoCost = 25;
      factoryCost = 120;
      boosterCost = 220;
      farmCost = 50;
      greenhouseCost = 260;
      seedTraderCost = 100;
      factoryLevel = 0;
      boosterActive = false;
      boosterEndsAt = 0;
      updateTexts();
      alert(`Prestige geslaagd! Je hebt ${gainedLevels} bonuslevels verdiend.`);
    });

    document.getElementById('autobuy').addEventListener('change', (e) => {
      autobuy = e.target.checked;
      updateTexts();
    });

    setInterval(() => {
      if (boosterActive) {
        if (Date.now() >= boosterEndsAt) {
          boosterActive = false;
        }
      }

      let earnedPoints = perSecond;
      if (boosterActive) earnedPoints *= 2;
      earnedPoints *= (1 + prestigeLevel * 0.01);
      points += earnedPoints;

      seeds += seedPerSecond;

      if (factoryLevel > 0) {
        const converted = Math.min(seeds, factoryLevel * 0.8);
        seeds -= converted;
        points += converted * 12;
      }

      if (autobuy) tryAutobuy();
      updateTexts();
    }, 1000);

    function init() {
      if (boosterEndsAt > Date.now()) {
        boosterActive = true;
      }
      updateTexts();
    }

    init();
  </script>
</body>
</html>
